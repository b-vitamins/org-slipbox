[package]
name = "slipbox-web"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Compile the built reading client (`client/dist`) into the binary. Off by
# default so a plain `cargo build` needs no built client; `slipbox web` enables
# it to ship a self-contained reader. See `build.rs`.
embed-assets = []

[dependencies]
slipbox-core = { path = "../slipbox-core" }
slipbox-daemon-client = { path = "../slipbox-daemon-client" }
slipbox-rpc = { path = "../slipbox-rpc" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
urlencoding.workspace = true
