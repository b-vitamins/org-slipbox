<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>slipbox</title>
    <!-- An explicit icon prevents probes for the absent favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply a stored scheme before first paint to avoid a palette flash. -->
    <script>
      try {
        var scheme = window.localStorage.getItem("slipbox:color-scheme");
        if (scheme === "light" || scheme === "dark") {
          document.documentElement.setAttribute("data-theme", scheme);
        }
      } catch (error) {
        /* Storage blocked: the platform scheme stands. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
