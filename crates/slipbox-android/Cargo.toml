[package]
name = "slipbox-android"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Android native consumer of the headless slipbox engine, with bundled SQLite."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
jni.workspace = true
# The JNI surface is a fixed set of exported functions, so the raw upstream
# bindings are enough; nothing here creates or attaches a JVM.
jni-sys = "0.4.1"
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
slipbox-core = { path = "../slipbox-core" }
# Android has no linkable system SQLite, so the bundled amalgamation is required
# rather than selectable: this crate declares no SQLite feature of its own.
slipbox-engine = { path = "../slipbox-engine", default-features = false, features = [
  "bundled-sqlite",
] }
slipbox-git = { path = "../slipbox-git" }
slipbox-rpc = { path = "../slipbox-rpc" }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
