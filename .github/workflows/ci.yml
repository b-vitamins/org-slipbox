name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/slipbox-web/client/package-lock.json

      # Build the client before the Rust steps: the workspace `--all-features`
      # clippy gate enables `embed-assets`, whose build script compiles this
      # tree in and fails when it is absent.
      - name: Build reading client
        run: make build-web

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check release metadata
        run: make check-release-metadata

      - name: Run Rust tests
        run: make test-rust

      - name: Run clippy
        run: make lint-rust

      - name: Run Emacs batch tests
        run: make test-elisp

      - name: Run benchmark regression gate
        run: make bench-check PROFILE=ci
