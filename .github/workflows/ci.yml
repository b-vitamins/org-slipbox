name: ci

on:
  push:
    branches:
      - master
  pull_request:
  # Releases reuse this suite.
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/slipbox-web/client/package-lock.json

      - name: Typecheck reading client
        run: make lint-web

      - name: Test reading client
        run: make test-web

      # All-feature clippy needs the built client for embed-assets.
      - name: Build reading client
        run: make build-web

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check release metadata
        run: make check-release-metadata

      - name: Run Rust tests
        run: make test-rust

      - name: Run clippy
        run: make lint-rust

      - name: Install Emacs for benchmarks
        uses: purcell/setup-emacs@d37e139fc118479b4396f9277927506a8c384519
        with:
          version: "30.2"

      - name: Run benchmark regression gate
        run: |
          set -euo pipefail
          benchmark_tmp="$(mktemp -d /dev/shm/slipbox-bench.XXXXXX)"
          trap 'rmdir "$benchmark_tmp" || true' EXIT
          mkdir -p target/bench
          df -T "$benchmark_tmp" | tee target/bench/filesystem.txt
          TMPDIR="$benchmark_tmp" make bench-check PROFILE=ci

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci
          path: |
            target/bench/ci-check.json
            target/bench/filesystem.txt
          if-no-files-found: warn

  elisp:
    name: elisp-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: emacs-29.1
            os: ubuntu-latest
            emacs: "29.1"
          - label: emacs-30.2
            os: ubuntu-latest
            emacs: "30.2"
          - label: macos-emacs-30.2
            os: macos-14
            emacs: "30.2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@d37e139fc118479b4396f9277927506a8c384519
        with:
          version: ${{ matrix.emacs }}

      - name: Run Emacs batch tests
        run: make test-elisp

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/slipbox-web/client/package-lock.json

      - name: Run reading-client end-to-end tests
        run: make test-e2e
