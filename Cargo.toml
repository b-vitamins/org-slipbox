[package]
name = "slipbox"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Personal knowledge management with interconnected Org notes."
publish = false

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["slipbox-engine/bundled-sqlite", "slipbox-store/bundled-sqlite"]
system-sqlite = ["slipbox-engine/system-sqlite", "slipbox-store/system-sqlite"]
# Compile the built reading client into the binary so `slipbox web` ships a
# self-contained reader. Off by default: a plain build needs no built client.
embed-web-client = ["slipbox-web/embed-assets"]

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["Ayan Das <bvits@riseup.net>"]
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.48", features = ["derive"] }
gix = { version = "0.87.1", default-features = false, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
] }
fs2 = "0.4.3"
jni = "0.22.4"
rusqlite = "0.37.0"
regex = "1.11.2"
ring = "0.17.14"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.20.0"
thiserror = "2.0.16"
walkdir = "2.5.0"
zeroize = "1.8.1"
url = "2.5.7"
urlencoding = "2.1.3"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
slipbox-core = { path = "crates/slipbox-core" }
slipbox-daemon-client = { path = "crates/slipbox-daemon-client" }
slipbox-engine = { path = "crates/slipbox-engine", default-features = false }
# The desktop service explicitly authorizes these helpers at construction.
slipbox-index = { path = "crates/slipbox-index", features = ["desktop-decryptors"] }
slipbox-rpc = { path = "crates/slipbox-rpc" }
slipbox-store = { path = "crates/slipbox-store", default-features = false }
slipbox-web = { path = "crates/slipbox-web" }
tempfile.workspace = true

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
slipbox-index = { path = "crates/slipbox-index" }
slipbox-store = { path = "crates/slipbox-store", default-features = false }
slipbox-write = { path = "crates/slipbox-write" }
tempfile.workspace = true
urlencoding.workspace = true
